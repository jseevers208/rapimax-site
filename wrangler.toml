# Rapimax — Cloudflare Worker + Assets
name = "rapimax-site"
compatibility_date = "2024-12-01"
main = "functions/worker.js"

[assets]
directory = "./dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "rapimax-db"
database_id = "" # Fill after: npx wrangler d1 create rapimax-db
