# Rapimax — Cloudflare Worker + Assets
name = "rapimax-site"
compatibility_date = "2024-12-01"
main = "functions/worker.js"
# Keep plain-text variables configured in the dashboard across deploys (safety net for production).
keep_vars = true

[assets]
directory = "./dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "rapimax-prod"
database_id = "80d06894-83c2-4d45-afe7-1f1b1889cf7b"

[[r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "rapimax-documents"

# Cron Triggers — email report digests
[triggers]
crons = [
  "0 12 * * *",   # Daily digest at 12:00 UTC (6:00 AM CST)
  "0 13 * * 1"    # Weekly digest Monday at 13:00 UTC (7:00 AM CST)
]

# =====================================================================
# DEMO ENVIRONMENT (workers.dev first, custom domain later)
# Separate Worker, separate D1 and R2. Production is not affected.
# Build with:   VITE_DEMO_MODE=true npm run build
# Deploy with:  npx wrangler deploy --env demo
# Secrets (set in dashboard or `wrangler secret put <NAME> --env demo`):
#   ADMIN_PASSWORD, RESEND_API_KEY, ANTHROPIC_API_KEY
# =====================================================================
[env.demo]
name = "rapimax-demo"
# Served on workers.dev first. When the final demo domain is chosen, add
# routes = [ { pattern = "demo.EXAMPLE.com", custom_domain = true } ] and redeploy with --env demo.
workers_dev = true

[env.demo.assets]
directory = "./dist"
binding = "ASSETS"

[[env.demo.d1_databases]]
binding = "DB"
database_name = "rapimax-demo"
database_id = "e324c749-9280-4cb1-b714-bb3db8712641"

[[env.demo.r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "rapimax-demo-documents"

[env.demo.triggers]
crons = [
  "0 12 * * *",
  "0 13 * * 1"
]

[env.demo.vars]
DEMO_MODE = "true"
ANTHROPIC_MODEL = "claude-sonnet-4-6"
# SITE_URL fallback for cron digests only; HTTP requests derive it from the request origin.
SITE_URL = "https://rapimax-demo.workers.dev"
NOTIFICATION_EMAIL = "jorge@logeek.io"
EMAIL_FROM = "RapiMax Demo <notificaciones@rapimax-dev.com>"
